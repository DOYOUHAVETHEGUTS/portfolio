<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Engineering Career Map — Layered</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f5f1e8; --ink: #1a1a2e; --panel: #ffffff; --border: #ddd5c4;
    --field: #1a5f4a; --skill: #2255aa; --education: #b8863b; --career: #7a3fa0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  header p { margin: 0; color: #666; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; padding: 12px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--border); align-items: center; }
  .toolbar span.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-right: 4px; }
  button.filter { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  button.filter.active { background: var(--ink); color: white; border-color: var(--ink); }
  button.filter .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  button.reset { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink); background: var(--panel); cursor: pointer; }
  button.reset:hover { background: var(--ink); color: white; }
  #search { margin-left: auto; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 200px; }
  .layout { display: flex; height: calc(100vh - 118px); }
  #graph { flex: 1; background: var(--bg); }
  #detail { width: 320px; border-left: 1px solid var(--border); padding: 20px; background: var(--panel); overflow-y: auto; }
  #detail .tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: #666; margin-bottom: 10px; }
  #detail h2 { margin: 0 0 10px; font-size: 20px; }
  #detail .blurb { font-size: 13px; color: #444; line-height: 1.5; margin-bottom: 16px; }
  #detail .rel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin: 14px 0 6px; }
  #detail .rel-item { font-size: 13px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  #detail .rel-item:hover { background: var(--bg); border-color: var(--border); }
  #detail .empty { color: #999; font-size: 13px; }
  #detail .info-list { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; color: #333; line-height: 1.5; }
  #detail .info-list a { color: #2255aa; }
  #detail .mentor-contact { margin: 4px 0 12px; font-size: 13px; }
  #detail .mentor-contact a { color: #7a3fa0; font-weight: 600; text-decoration: none; }
  #detail .mentor-contact a:hover { text-decoration: underline; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  .node text { font-size: 16px; pointer-events: none; fill: var(--ink); }
  .link { stroke: #ccc; stroke-width: 1px; fill: none; }
  .link.dim { stroke-opacity: 0.06; }
  .node.dim { opacity: 0.15; }

.link { stroke-opacity: 0.35; }
</style></head><body>
<header><h1>Engineering Career Map — Layered</h1><p>Fields, skills, education, and careers laid out in fixed columns — nothing to hunt for or drag into view. Click any node.</p></header>

<div class="toolbar">
  <span class="label">Show</span>
  <button class="filter active" data-type="all"><span class="dot" style="background:#999"></span>All</button>
  <button class="filter" data-type="field"><span class="dot" style="background:var(--field)"></span>Fields</button>
  <button class="filter" data-type="skill"><span class="dot" style="background:var(--skill)"></span>Skills</button>
  <button class="filter" data-type="education"><span class="dot" style="background:var(--education)"></span>Education</button>
  <button class="filter" data-type="career"><span class="dot" style="background:var(--career)"></span>Careers</button>
  <input id="search" placeholder="Search nodes...">
  <button class="reset" id="resetBtn">Reset view</button>
</div>

<div class="layout"><div id="graph"></div><div id="detail"><p class="empty">Click a node to see details and connections.</p></div></div>

 "target": "career_imaging_systems_engineer"}, {"source": "biomedical", "target": "skill_biomaterials"}, {"source": "skill_biomaterials", "target": "edu_biomedical_eng_degree"}, {"source": "skill_biomaterials", "target": "edu_materials_science"}, {"source": "skill_biomaterials", "target": "career_biomaterials_engineer"}, {"source": "computer", "target": "skill_computer_architecture"}, {"source": "skill_computer_architecture", "target": "edu_computer_eng_degree"}, {"source": "skill_computer_architecture", "target": "edu_digital_logic"}, {"source": "skill_computer_architecture", "target": "career_hardware_architect"}, {"source": "computer", "target": "skill_software_engineering"}, {"source": "skill_software_engineering", "target": "edu_computer_eng_degree"}, {"source": "skill_software_engineering", "target": "edu_programming_fundamentals"}, {"source": "skill_software_engineering", "target": "career_software_engineer"}, {"source": "computer", "target": "skill_cybersecurity"}, {"source": "skill_cybersecurity", "target": "edu_computer_eng_degree"}, {"source": "skill_cybersecurity", "target": "edu_linux_and_networking"}, {"source": "skill_cybersecurity", "target": "career_security_engineer"}]};
const COLORS = { field: "#1a5f4a", skill: "#2255aa", education: "#b8863b", career: "#7a3fa0" };
let selected = null, activeFilter = "all";
// Fixed layout dimensions so column spacing stays constant regardless of the
// container size (zoom/pan handle fitting). This prevents label overlap at
// narrow widths and leaves room for the larger label font below.
const LAYOUT_W = 1600;
const eduCount = DATA.nodes.filter(n => n.type === "education").length;
const LAYOUT_H = Math.max(document.getElementById('graph').clientHeight || 0, (eduCount + 1) * 34, 900);
const width = LAYOUT_W;
const height = LAYOUT_H;

// --- deterministic column layout, computed in the browser from DATA ---
// Wide, even column gaps; education labels point right, career labels point
// left, with enough space between columns 3 and 4 that they never collide.
const colX4 = [width * 0.05, width * 0.30, width * 0.56, width * 0.93];
const typeCol = { field: 0, skill: 1, education: 2, career: 3 };

const byField = d3.group(DATA.nodes.filter(n => n.type !== "field"), n => n.field);
const fieldOrder = DATA.nodes.filter(n => n.type === "field").map(n => n.id);

function layoutColumn(type) {
  const items = DATA.nodes.filter(n => n.type === type)
    .sort((a, b) => fieldOrder.indexOf(a.field) - fieldOrder.indexOf(b.field));
  const step = height / (items.length + 1);
  items.forEach((n, i) => { n.x = colX4[typeCol[type]]; n.y = step * (i + 1); });
}
["field", "skill", "education", "career"].forEach(layoutColumn);

const svg = d3.select("#graph").append("svg").attr("width", "100%").attr("height", "100%")
  .attr("viewBox", [0, 0, width, height]).attr("preserveAspectRatio", "xMidYMid meet");
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.5, 3]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);
const nodesById = new Map(DATA.nodes.map(n => [n.id, n]));
const neighbors = new Map(DATA.nodes.map(n => [n.id, new Set([n.id])]));
DATA.links.forEach(l => { neighbors.get(l.source).add(l.target); neighbors.get(l.target).add(l.source); });

function linkPath(d) {
  const s = nodesById.get(d.source), t = nodesById.get(d.target);
  const mx = (s.x + t.x) / 2;
  return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`;
}

const link = g.append("g").selectAll("path").data(DATA.links).join("path")
  .attr("class", "link").attr("stroke", "#bbb").attr("d", linkPath);

const node = g.append("g").selectAll("g").data(DATA.nodes).join("g").attr("class", "node")
  .attr("transform", d => `translate(${d.x},${d.y})`);
node.append("circle").attr("r", d => d.type === "field" ? 13 : 8).attr("fill", d => COLORS[d.type]);
node.append("text")
  .attr("x", d => d.type === "career" ? -14 : (d.type === "field" ? 20 : 14))
  .attr("text-anchor", d => d.type === "career" ? "end" : "start")
  .attr("y", 5).attr("font-size", 16).text(d => d.name);
node.on("click", (e, d) => { e.stopPropagation(); selectNode(d); });

function resetLayout() {
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
}


function selectNode(d) {
  if (selected && selected.id === d.id) { deselectAll(); return; }
  selected = d;
  const rel = [...neighbors.get(d.id)].filter(id => id !== d.id).map(id => nodesById.get(id));
  node.classed("dim", n => !neighbors.get(d.id).has(n.id));
  link.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);

  const groups = { field: [], skill: [], education: [], career: [] };
  rel.forEach(n => groups[n.type].push(n));

  let html = `<div class="tag">${d.type}</div><h2>${d.name}</h2>`;
  html += `<div class="blurb">${d.description || d.blurb || "Explore its connected skills, education paths, and careers."}</div>`;

  const listSection = (title, items) => {
    if (!items || !items.length) return "";
    let s = `<div class="rel-title">${title}</div><ul class="info-list">`;
    items.forEach(it => { s += `<li>${it}</li>`; });
    return s + "</ul>";
  };
  const linkSection = (title, items) => {
    if (!items || !items.length) return "";
    let s = `<div class="rel-title">${title}</div><ul class="info-list">`;
    items.forEach(it => { s += `<li><a href="${it.url}" target="_blank" rel="noopener">${it.name}</a></li>`; });
    return s + "</ul>";
  };

  html += linkSection("Self-Assessment Tools", d.self_assessment);
  html += listSection("Mentor Guidance", d.mentor_guidance);
  if (d.mentor_contact) {
    html += `<p class="mentor-contact"><a href="${d.mentor_contact.url}" target="_blank" rel="noopener">${d.mentor_contact.name}</a></p>`;
  }
  html += linkSection("Labor Market Research", d.labor_market);
  html += `<div class="rel-title">Internships &amp; Job Shadowing</div>`;
  html += (d.opportunities && d.opportunities.length)
    ? `<ul class="info-list">${d.opportunities.map(o => `<li><a href="${o.url}" target="_blank" rel="noopener">${o.name}</a></li>`).join("")}</ul>`
    : `<p class="empty" style="margin:0 0 10px;">Coming soon.</p>`;

  for (const [type, items] of Object.entries(groups)) {
    if (!items.length) continue;
    html += `<div class="rel-title">Connected ${type}${items.length > 1 ? "s" : ""}</div>`;
    items.forEach(n => { html += `<div class="rel-item" data-id="${n.id}" style="color:${COLORS[n.type]}">${n.name}</div>`; });
  }
  document.getElementById("detail").innerHTML = html;
  document.querySelectorAll(".rel-item").forEach(el => {
    el.addEventListener("click", () => selectNode(nodesById.get(el.dataset.id)));
  });
}

function deselectAll() {
  selected = null;
  node.classed("dim", false);
  link.classed("dim", false);
  document.getElementById("detail").innerHTML = '<p class="empty">Click a node to see details and connections.</p>';
}

svg.on("click", (e) => { if (e.target === svg.node()) deselectAll(); });

document.querySelectorAll("button.filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("button.filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.type;
    applyFilter();
  });
});

function applyFilter() {
  const type = activeFilter;
  node.style("display", d => (type === "all" || d.type === type) ? null : "none");
  link.style("display", l => {
    if (type === "all") return null;
    return (l.source.type === type || l.target.type === type) ? null : "none";
  });
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  node.style("opacity", d => !q || d.name.toLowerCase().includes(q) ? 1 : 0.12);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  deselectAll();
  activeFilter = "all";
  document.querySelectorAll("button.filter").forEach(b => b.classList.remove("active"));
  document.querySelector('button.filter[data-type="all"]').classList.add("active");
  document.getElementById("search").value = "";
  applyFilter();
  node.style("opacity", 1);
  resetLayout();
});

</script></body></html>
